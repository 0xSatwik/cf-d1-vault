name = "cf-d1-vault"
main = "src/index.ts"
compatibility_date = "2026-11-17"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "cf-vault"
database_id = "1c8c06f2-7e12-4768-8d11-36fd31c4e663"
migrations_dir = "migrations"

[vars]
PUBLIC_ORIGIN = "https://cf-d1-vault.hardeepwalia77.workers.dev"
ENABLE_GITHUB_WRITES = "false"

[observability]
enabled = false

# Secret bindings, provisioned separately by Muse:
# VAULT_DEK_V1, optional VAULT_DEK_V2, MASTER_SHA256
