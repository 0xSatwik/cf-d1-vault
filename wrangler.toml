name = "cf-d1-vault"
main = "src/index.ts"
compatibility_date = "2026-11-17"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "cf-vault"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
PUBLIC_ORIGIN = "https://<name>.<subdomain>.workers.dev"
ENABLE_GITHUB_WRITES = "false"

[observability]
enabled = false

# Secret bindings, provisioned separately by Muse (wrangler secret put):
# VAULT_DEK_V1, optional VAULT_DEK_V2, MASTER_SHA256, HUMAN_SHA256
# Nothing sensitive lives in [vars] below — only the public origin and a flag.
